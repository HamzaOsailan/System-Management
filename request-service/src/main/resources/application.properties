spring.application.name=request-service
server.port=${SERVER_PORT:8082}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sahab_requests?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:spring}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Internal service-to-service API key: replace with a strong environment secret.
sahab.internal-api-key=${SAHAB_INTERNAL_API_KEY:local-dev-change-me}

# Domain event publishing
sahab.events.exchange=${SAHAB_EVENTS_EXCHANGE:sahab.domain.events.exchange}
sahab.events.routing-key=${SAHAB_EVENTS_ROUTING_KEY:domain.event}
sahab.outbox.poll-delay-ms=${SAHAB_OUTBOX_POLL_DELAY_MS:5000}
